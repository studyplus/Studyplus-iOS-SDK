name: PR check

on: pull_request

permissions:
  contents: read

jobs:
  danger:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # Danger が PR にコメントするため
      issues: read  # Danger が PR の情報(ラベル等)を issues API で読むため
      statuses: write  # Danger が結果をコミットステータスに付けるため

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Danger(SwiftLint)
        uses: docker://ghcr.io/danger/danger-swift-with-swiftlint@sha256:2ad66810ba60c21eacae54e698e690ddd9fa61073253b19dc68dadc3b8f2a71b # 3.8.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
